<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Builder</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007aff">
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --text-color: #1c1c1e;
            --subtext-color: #8e8e93;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body.dark-mode {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --subtext-color: #98989d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin: 0; }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid #d1d1d6;
            color: var(--text-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tab-bar {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            color: var(--subtext-color);
        }

        .tab.active { background: var(--primary); color: white; }
        .hidden { display: none !important; }

        .form-card, .vocab-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-secondary { background-color: var(--card-bg); color: var(--text-color); border: 1px solid #d1d1d6; }

        .vocab-list { display: flex; flex-direction: column; gap: 10px; }
        .vocab-word-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .vocab-word { font-size: 18px; font-weight: bold; }
        .vocab-score { font-size: 12px; color: var(--primary); font-weight: bold; background: rgba(0,122,255,0.1); padding: 2px 8px; border-radius: 12px; }
        .vocab-def { font-size: 14px; color: var(--subtext-color); }

        /* Flashcard Swipe Styles */
        #card-container {
            position: relative;
            perspective: 1000px;
        }

        .flashcard {
            background: var(--primary);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            margin-bottom: 12px;
            touch-action: pan-y; /* Allows vertical scrolling, captures horizontal swipes */
            transition: transform 0.2s ease-out; /* Smooth snapping */
            user-select: none;
        }

        .flashcard.flipped {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--primary);
            box-shadow: none;
        }

        .flashcard .small-word {
            font-size: 14px;
            color: var(--subtext-color);
            margin-bottom: 12px;
            font-weight: normal;
        }

        .quiz-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Vocab Builder</h1>
            <button id="themeToggle" class="icon-btn" onclick="toggleTheme()">🌙</button>
        </div>

        <div class="tab-bar">
            <div id="tab-list" class="tab active" onclick="switchTab('list')">List</div>
            <div id="tab-quiz" class="tab" onclick="switchTab('quiz')">Study</div>
        </div>
        
        <!-- View 1: Word List -->
        <div id="view-list">
            <div class="form-card">
                <input type="text" id="wordInput" placeholder="New Word">
                <input type="text" id="defInput" placeholder="Definition">
                <button onclick="addWord()">Add to Vocabulary</button>
            </div>
            <div class="vocab-list" id="vocabList"></div>
        </div>

        <!-- View 2: Flashcard Quiz -->
        <div id="view-quiz" class="hidden">
            <div id="card-container">
                <!-- Removed onclick, replaced with touch gestures in JS -->
                <div id="flashcard" class="flashcard"></div>
            </div>
            
            <button class="btn-secondary" onclick="pronounceWord()" style="margin-bottom: 20px; padding: 10px;">🔊 Pronounce Aloud</button>

            <div class="quiz-controls">
                <button class="btn-danger" onclick="scoreWord(-1)" style="flex: 1;">&larr; Forgot</button>
                <button class="btn-secondary" onclick="shuffleCards()" style="flex: 0.5; font-size: 20px; padding: 12px;">🔀</button>
                <button class="btn-success" onclick="scoreWord(1)" style="flex: 1;">Knew It &rarr;</button>
            </div>
            <div id="quiz-progress" style="text-align: center; margin-top: 16px; color: var(--subtext-color); font-size: 14px;"></div>
        </div>
    </div>

    <script>
        let vocabList = JSON.parse(localStorage.getItem('vocabList')) || [];
        let currentCardIndex = 0;
        let isFlipped = false;

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeToggle').innerText = '☀️';
        }

        vocabList.forEach(w => { if(w.score === undefined) w.score = 0; });

        // Core Functions
        function saveData() { localStorage.setItem('vocabList', JSON.stringify(vocabList)); }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                btn.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                btn.innerText = '🌙';
            }
        }

        function addWord() {
            const word = document.getElementById('wordInput').value.trim();
            const def = document.getElementById('defInput').value.trim();
            if (!word || !def) return;
            vocabList.push({ word, def, score: 0 });
            saveData();
            document.getElementById('wordInput').value = '';
            document.getElementById('defInput').value = '';
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('vocabList');
            listEl.innerHTML = '';
            const sortedList = [...vocabList].sort((a, b) => a.score - b.score);
            sortedList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-word-row">
                        <span class="vocab-word">${escapeHtml(item.word)}</span>
                        <span class="vocab-score">Mastery: ${item.score}</span>
                    </div>
                    <div class="vocab-def">${escapeHtml(item.def)}</div>
                `;
                listEl.appendChild(card);
            });
        }

        function pronounceWord() {
            if (vocabList.length === 0) return;
            const currentWord = vocabList[currentCardIndex].word;
            speechSynthesis.speak(new SpeechSynthesisUtterance(currentWord));
        }

        function shuffleCards() {
            for (let i = vocabList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabList[i], vocabList[j]] = [vocabList[j], vocabList[i]];
            }
            saveData();
            currentCardIndex = 0;
            isFlipped = false;
            renderQuiz();
        }

        function scoreWord(points) {
            if (vocabList.length === 0) return;
            vocabList[currentCardIndex].score += points;
            saveData();
            currentCardIndex = (currentCardIndex + 1) % vocabList.length;
            isFlipped = false;
            renderQuiz();
            renderList();
        }

        function switchTab(tab) {
            document.getElementById('tab-list').classList.toggle('active', tab === 'list');
            document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
            document.getElementById('view-list').classList.toggle('hidden', tab === 'quiz');
            document.getElementById('view-quiz').classList.toggle('hidden', tab === 'list');
            if (tab === 'quiz') {
                vocabList.sort((a, b) => a.score - b.score);
                currentCardIndex = 0;
                isFlipped = false;
                renderQuiz();
            } else {
                renderList();
            }
        }

        function renderQuiz() {
            const cardEl = document.getElementById('flashcard');
            const progressEl = document.getElementById('quiz-progress');
            
            // Reset transforms just in case
            cardEl.style.transform = 'translateX(0px) rotate(0deg)';

            if (vocabList.length === 0) {
                cardEl.innerHTML = `<div style="font-size:20px; font-weight:normal;">Add some words first!</div>`;
                cardEl.className = 'flashcard flipped';
                progressEl.innerText = "";
                return;
            }

            const currentVocab = vocabList[currentCardIndex];
            if (isFlipped) {
                cardEl.innerHTML = `
                    <div class="small-word">${escapeHtml(currentVocab.word)} means:</div>
                    <div style="font-size: 22px;">${escapeHtml(currentVocab.def)}</div>
                `;
                cardEl.className = 'flashcard flipped';
            } else {
                cardEl.innerHTML = escapeHtml(currentVocab.word);
                cardEl.className = 'flashcard';
            }
            progressEl.innerText = `Card ${currentCardIndex + 1} of ${vocabList.length} • Current Mastery Score: ${currentVocab.score}`;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // --- Swipe Gesture Logic ---
        const flashcardEl = document.getElementById('flashcard');
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        // For touch devices (iPhone)
        flashcardEl.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            flashcardEl.style.transition = 'none'; // Remove snap transition while dragging
        });

        flashcardEl.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const deltaX = currentX - startX;
            // Move the card visually and rotate it slightly
            flashcardEl.style.transform = `translateX(${deltaX}px) rotate(${deltaX * 0.05}deg)`;
        });

        flashcardEl.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const deltaX = currentX - startX;
            
            flashcardEl.style.transition = 'transform 0.2s ease-out'; // Bring back snap transition
            
            if (Math.abs(deltaX) > 80) { // If swiped more than 80 pixels
                if (deltaX > 0) {
                    scoreWord(1); // Swipe Right
                } else {
                    scoreWord(-1); // Swipe Left
                }
            } else {
                // If it was just a tap (or very tiny drag), snap back and flip
                flashcardEl.style.transform = 'translateX(0px) rotate(0deg)';
                if (Math.abs(deltaX) < 10) {
                    if (vocabList.length > 0) {
                        isFlipped = !isFlipped;
                        renderQuiz();
                    }
                }
            }
            startX = 0; currentX = 0;
        });

        renderList();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
